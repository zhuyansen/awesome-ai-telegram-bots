name: Add a repo
description: Suggest an open-source AI Telegram bot
title: "Add: owner/repo"
labels: ["submission"]
body:
  - type: input
    id: url
    attributes:
      label: GitHub URL
      placeholder: https://github.com/owner/repo
    validations:
      required: true
  - type: dropdown
    id: kind
    attributes:
      label: What kind of bot is it?
      options:
        - AI assistants
        - Agent remote control
        - Frameworks & MCP
        - Utility bots
        - Fun & learning
        - Business
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Anything the README does not say
      description: Optional. The review reads the README, so the best way to get listed is a README that shows it working.
